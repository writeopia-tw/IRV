<style>

<header><div><div class="eyebrow">VOCABULARY · LISTEN & REPEAT</div><h1>第 11–20 題字彙聽讀</h1><p>點英文單字或搭配詞聽發音，再跟著唸一次。</p></div><div class="badge"><strong id="total"></strong>個字彙與片語</div></header>
<div class="panel"><div class="settings"><label class="search-label">搜尋字彙或中文<input id="search" type="search" placeholder="例如：suspicion、獎學金"></label><label>速度<select id="rate"><option value="0.7">0.7× 慢速</option><option value="0.85" selected>0.85× 清晰</option><option value="1">1.0× 正常</option><option value="1.15">1.15× 快速</option></select></label><label class="toggle"><input id="hide" type="checkbox">隱藏中文，自我檢查</label></div></div>

<div class="meta"><span id="count"></span><span id="status" role="status" aria-live="polite">準備好了。點英文即可播放。</span></div><div id="content"></div>

</main><script>

const $=id=>document.getElementById(id);const synth=window.speechSynthesis;let question='all',selectedVoice=null,version=0,current=null,active=null;let displayed=[];
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function clearActive(){if(active){active.classList.remove('active');active.closest('tr')?.classList.remove('playing');active=null}}
function stop(){version++;if(synth)synth.cancel();current=null;clearActive();$('play').textContent='▶ 播放目前列表'}
function loadVoices(){if(!synth)return;const english=synth.getVoices().filter(v=>/^en(?:[-_]|$)/i.test(v.lang));function score(v){let n=0;if(/natural|neural|premium|enhanced|online/i.test(v.name))n+=100;if(/^en[-_]GB$/i.test(v.lang))n+=20;if(/Daniel|Samantha|Serena|Sonia|Ryan|Oliver|Google.*English/i.test(v.name))n+=10;if(v.default)n+=2;return n}selectedVoice=english.map((voice,index)=>({voice,index,score:score(voice)})).sort((a,b)=>b.score-a.score||a.index-b.index)[0]?.voice||null}
function speak(text,button,token,done){if(!synth||!window.SpeechSynthesisUtterance){status('此瀏覽器不支援語音。請改用 Safari、Chrome 或 Edge。',true);done?.(false);return}clearActive();active=button;if(active){active.classList.add('active');active.closest('tr')?.classList.add('playing')}const u=new SpeechSynthesisUtterance(text);current=u;if(!selectedVoice)loadVoices();const voice=selectedVoice;if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-GB';u.rate=Number($('rate').value);status(`正在播放：${text}`);u.onend=()=>{if(token!==version)return;current=null;clearActive();done?.(true)};u.onerror=e=>{if(token!==version)return;clearActive();current=null;status('語音未能播放，請檢查裝置音量，或重新開啟瀏覽器後再試。',true);$('play').textContent='▶ 播放目前列表';done?.(false)};synth.resume();synth.speak(u)}
function soundButton(text,id){const b=document.createElement('button');b.type='button';b.className='speak';b.textContent=text;b.id=id;b.setAttribute('aria-label',`播放英文：${text}`);b.addEventListener('click',()=>{stop();const token=version;speak(text,b,token,ok=>{if(ok)status(`已播放：${text}`)})});return b}
function render(){stop();const keyword=$('search').value.trim().toLocaleLowerCase();$('content').replaceChildren();displayed=[];let total=0;DATA.forEach(group=>{if(question!=='all'&&question!==String(group.q))return;const filtered=group.items.map((item,index)=>({item,index})).filter(({item})=>item.join(' ').toLocaleLowerCase().includes(keyword));if(!filtered.length)return;const section=document.createElement('section'),heading=document.createElement('h2'),num=document.createElement('span');num.className='qnum';num.textContent=String(group.q);heading.append(num,document.createTextNode(group.topic));section.append(heading);const table=document.createElement('table');table.innerHTML='<thead><tr><th>英文 · 點選聽發音</th><th>詞性</th><th>中文意思</th><th>常見搭配 · 可點選</th></tr></thead>';const tbody=document.createElement('tbody');filtered.forEach(({item,index})=>{const [word,pos,meaning,usage]=item,tr=document.createElement('tr');const a=document.createElement('td');const b=soundButton(word,`w${group.q}-${index}`);a.append(b);const p=document.createElement('td');p.className='pos';p.textContent=pos;const c=document.createElement('td');c.className='meaning';c.textContent=meaning;const d=document.createElement('td');d.className='usage';if(usage)d.append(soundButton(usage,`u${group.q}-${index}`));else d.textContent='—';tr.append(a,p,c,d);tbody.append(tr);displayed.push({word,button:b});total++});table.append(tbody);section.append(table);$('content').append(section)});$('count').textContent=`目前顯示 ${total} 個字彙與片語`;$('play').disabled=!total;if(!total)$('content').innerHTML='<div class="empty">沒有符合的字彙，請試試其他關鍵字。</div>';status('點英文即可播放。')}
[{q:'all',label:'全部'},...DATA.map(g=>({q:String(g.q),label:`第 ${g.q} 題`}))].forEach(x=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x.label;b.setAttribute('aria-pressed',String(x.q==='all'));b.addEventListener('click',()=>{question=x.q;document.querySelectorAll('.chip').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));render()});$('filters').append(b)});
$('total').textContent=DATA.reduce((n,g)=>n+g.items.length,0);$('search').addEventListener('input',render);$('hide').addEventListener('change',()=>document.body.classList.toggle('hide-cn',$('hide').checked));$('stop').addEventListener('click',()=>{stop();status('已停止播放。')});$('rate').addEventListener('change',()=>{stop();status('已調整速度，點英文即可播放。')});$('play').addEventListener('click',()=>{stop();if(!displayed.length)return;const token=version,queue=[...displayed];let index=0;$('play').textContent='♫ 正在播放列表';function next(){if(token!==version)return;if(index>=queue.length){clearActive();$('play').textContent='▶ 播放目前列表';status('列表播放完成。');return}const item=queue[index++];speak(item.word,item.button,token,ok=>{if(ok)setTimeout(next,300)})}next()});window.addEventListener('pagehide',stop);render();loadVoices();if(synth)synth.addEventListener('voiceschanged',loadVoices);else status('此瀏覽器不支援語音。請改用 Safari、Chrome 或 Edge。',true);
</script></body></html>
